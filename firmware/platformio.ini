; T-Watch S3 (SX1262) firmware. Decisions: docs/adr/0002-firmware-platform.md
[platformio]
default_envs = twatch
boards_dir = boards

[env:twatch]
; pioarduino = Arduino-ESP32 3.3.x (required by LilyGoLib 0.3.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = lilygo-t-watch-s3
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
lib_ldf_mode = deep+
extra_scripts = pre:tools/build_info.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
    -D ARDUINO_T_WATCH_S3
    -D ARDUINO_LILYGO_LORA_SX1262
    -D LV_CONF_INCLUDE_SIMPLE
    -D LILYGO_SCREEN_CAPTURE_ENABLED=1 ; GET /screenshot (115 KB PSRAM copy of the frame)
    -D CORE_DEBUG_LEVEL=0
    ; RadioLib is a hard dependency of LilyGoLib headers: keep only the SX1262 driver
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_STM32WLX
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_BELL
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_FSK4
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_LORAWAN
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_PAGER
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -I include
    ; Meshtastic core: its sources include headers relative to these dirs
    -I lib/meshtastic/variant
    -I lib/meshtastic/src
    -I lib/meshtastic/src/mesh
    -I lib/meshtastic/src/mesh/generated
    -I lib/meshtastic/src/gps
    -I lib/meshtastic/src/buzz
    -I lib/meshtastic/src/platform/esp32
    -D TWATCH_MESH=1
    -D T_WATCH_S3 ; Meshtastic hardware model (LilyGoLib uses ARDUINO_T_WATCH_S3)
    -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868 ; default region (changeable in the app)
    -D PB_ENABLE_MALLOC=1
    -D PB_VALIDATE_UTF8=1
    -D USE_THREAD_NAMES
    -D TINYGPS_OPTION_NO_CUSTOM_FIELDS
    -D MAX_THREADS=40
    -D APP_VERSION=2.8.3.twatch
    -D APP_VERSION_SHORT=2.8.3
    -D APP_ENV=t-watch-s3
    -D APP_REPO=gpont
    -D BUILD_EPOCH=1794787200
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    -D MESHTASTIC_EXCLUDE_GPS=1
    -D MESHTASTIC_EXCLUDE_WIFI=1
    -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
    -D MESHTASTIC_EXCLUDE_MQTT=1
    -D MESHTASTIC_EXCLUDE_POWERMON=1
    -D MESHTASTIC_EXCLUDE_POWER_FSM=1
    -D MESHTASTIC_EXCLUDE_I2C=1
    -D MESHTASTIC_EXCLUDE_TZ=1
    -D MESHTASTIC_EXCLUDE_AUDIO=1
    -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
    -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
    -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
    -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
    -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
    -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
    -D MESHTASTIC_EXCLUDE_RANGETEST=1
    -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
    -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
    -D MESHTASTIC_EXCLUDE_TRAFFIC_MANAGEMENT=1
    -D MESHTASTIC_EXCLUDE_ATAK=1
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
    -D MESHTASTIC_EXCLUDE_TRACEROUTE=1
    -D MESHTASTIC_EXCLUDE_WAYPOINT=1
    -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
    -D MESHTASTIC_EXCLUDE_SERIAL=1
    -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
    -D MESHTASTIC_EXCLUDE_DROPZONE=1
    -D MESHTASTIC_EXCLUDE_REPLYBOT=1
    -D MESHTASTIC_EXCLUDE_GENERIC_THREAD_MODULE=1
    -D MESHTASTIC_EXCLUDE_WEBSERVER=1
    ; LDF fails to give the framework WiFi library its Network dependency's include path
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
; versions pinned to LilyGoLib/docs/third_party.md (T-Watch-S3).
; Not included by LilyGoLib and unused by us, so dropped: IRremoteESP8266, ESP8266Audio, PCMFlow(G722), XPowersLib.
lib_deps =
    xinyuan-lilygo/LilyGoLib @ 0.3.0
    lvgl/lvgl @ 9.6.0
    lewisxhe/SensorLib @ 0.5.0
    https://github.com/jgromes/RadioLib/archive/5878f990bdb4c95c75494a21562c0c5a49659c6f.zip ; commit pinned by meshtastic 2.8.3 (LilyGoLib only uses basic calls)
    h2zero/NimBLE-Arduino @ 2.5.1   ; M3: ANCS
    bblanchon/ArduinoJson @ ^7.4.0  ; M4: server state
    ; Meshtastic core (lib/meshtastic) dependencies, versions as pinned by meshtastic/firmware 2.8.3
    https://github.com/nanopb/nanopb/archive/0.4.92.zip
    https://github.com/meshtastic/Crypto/archive/9ceb213b3967246ade4394a8ba8895dddffb4366.zip
    https://github.com/meshtastic/ArduinoThread/archive/b841b0415721f1341ea41cccfb4adccfaf951567.zip
    https://github.com/Erriez/ErriezCRC32/archive/refs/tags/1.0.1.zip
    ; headers the core includes unconditionally (screen/button/FSM/GPS types; the code paths are excluded)
    https://github.com/meshtastic/esp8266-oled-ssd1306/archive/bb93fd40685f22e850330ea162f1dd154a4e0685.zip
    https://github.com/meshtastic/OneButton/archive/fa352d668c53f290cfa480a5f79ad422cd828c70.zip
    https://github.com/meshtastic/arduino-fsm/archive/7db3702bf0cfe97b783d6c72595e3f38e0b19159.zip
    https://github.com/meshtastic/TinyGPSPlus/archive/71a82db35f3b973440044c476d4bcdc673b104f4.zip
; ESP-IDF power management + BT controller modem sleep (iPhone notifications need auto light sleep).
; pioarduino hybrid compile: the framework libs are rebuilt from source (slow first build, docs/dev-workflow.md §11)
custom_sdkconfig =
    CONFIG_PM_ENABLE=y
    CONFIG_PM_PROFILING=y
    CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
    CONFIG_BT_CTRL_MODEM_SLEEP=y
    CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
    CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
    CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y

; wireless upload: tools/ota_upload.sh (reuses the twatch build dir, no second full build)

; host-side unit tests for pure logic (no Arduino)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
build_src_filter = -<*>
lib_compat_mode = off
